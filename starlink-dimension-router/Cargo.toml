[package]
name = "starlink-dimension-router"
version = "0.1.0"
edition = "2021"

[dependencies]
aiwork-core = { path = "../src-core" }
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", features = ["json"] }
