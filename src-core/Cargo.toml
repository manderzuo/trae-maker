[package]
name = "aiwork-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
